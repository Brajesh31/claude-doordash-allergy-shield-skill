<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-labelledby="t"><title id="t">Allergy review decision flow</title><rect width="820" height="230" rx="16" fill="#f8f9fb"/><g font-family="Arial" text-anchor="middle"><g fill="#233b53"><rect x="25" y="70" width="155" height="80" rx="12"/><rect x="225" y="70" width="155" height="80" rx="12"/><rect x="425" y="70" width="155" height="80" rx="12"/><rect x="625" y="70" width="170" height="80" rx="12"/></g><g fill="#fff" font-size="15"><text x="102" y="103">Identify allergen</text><text x="102" y="124">and exact item</text><text x="302" y="103">Review ingredients</text><text x="302" y="124">and unknowns</text><text x="502" y="103">Ask about</text><text x="502" y="124">cross-contact</text><text x="710" y="103">Proceed only</text><text x="710" y="124">if confirmed</text></g><g stroke="#71869a" stroke-width="3" fill="none"><path d="M180 110h45m-10-8 10 8-10 8M380 110h45m-10-8 10 8-10 8M580 110h45m-10-8 10 8-10 8"/></g><text x="410" y="36" fill="#233b53" font-size="18" font-weight="bold">Never assume an item is allergy-safe</text><text x="410" y="190" fill="#9b3030" font-size="14">Unconfirmed ingredients or kitchen practices = unresolved risk</text></g></svg>